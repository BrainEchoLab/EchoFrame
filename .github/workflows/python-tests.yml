name: Python tests

# Exercises the pure-Python helpers in echoframe/python/core. None of them import
# the compiled `echoframe` extension, so this needs no CUDA toolkit and no GPU and
# runs in seconds.
#
# The CUDA-backed Python bindings are not covered here: building them needs the
# toolkit, and running them needs a GPU, neither of which hosted runners have.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Keep the default token read-only, and cancel superseded runs on the same ref.
permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the published binaries target; 3.10 is the documented floor.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run tests
        run: python -m pytest echoframe/python/tests -v
