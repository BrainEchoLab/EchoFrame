name: MATLAB tests

# Runs the one harness that needs neither a GPU nor the compiled MEX:
# echoframe/matlab/tests/verify_batch_loading_headless.m. It checks batch_loading
# against known synthetic data by direct array comparison, sweeping the memory
# budget across every window regime, so it exercises real logic rather than just
# importing the code.
#
# The other verify_* harnesses need a CUDA GPU *and* an elevated session (the
# storage Handler acquires SeManageVolumePrivilege at init), so they cannot run
# on hosted runners. See echoframe/matlab/tests/README.md.
#
# matlab-actions/setup-matlab runs without a license on GitHub-hosted runners for
# public repositories. On a private repository this job needs a MATLAB batch
# licensing token in secrets.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Keep the default token read-only, and cancel superseded runs on the same ref.
permissions:
  contents: read

concurrency:
  group: matlab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a
          # verify_core_headless reaches initialize_image_reconstruction, which
          # builds tgcVector with gausswin, and echoframe_setup_fourier, which
          # apodises k-space with tukeywin.
          products: Signal_Processing_Toolbox

      - name: Run the headless verification harnesses
        uses: matlab-actions/run-command@v2
        env:
          # The scripts read this themselves; check_echoframe_path errors without it.
          ECHOFRAME_PATH: ${{ github.workspace }}
        with:
          command: |
            addpath(genpath(fullfile(getenv('ECHOFRAME_PATH'), 'echoframe', 'matlab')));
            verify_core_headless
            verify_batch_loading_headless

      # checkcode is a linter, not a test: report findings without failing the build.
      - name: Lint the MATLAB library (report only)
        if: always()
        uses: matlab-actions/run-command@v2
        env:
          ECHOFRAME_PATH: ${{ github.workspace }}
        with:
          command: |
            root = fullfile(getenv('ECHOFRAME_PATH'), 'echoframe', 'matlab');
            files = dir(fullfile(root, '**', '*.m'));
            total = 0;
            for k = 1:numel(files)
                f = fullfile(files(k).folder, files(k).name);
                msgs = checkcode(f, '-id', '-struct');
                if ~isempty(msgs)
                    fprintf('%s (%d)\n', f, numel(msgs));
                    total = total + numel(msgs);
                end
            end
            fprintf('checkcode messages across %d files: %d\n', numel(files), total);
